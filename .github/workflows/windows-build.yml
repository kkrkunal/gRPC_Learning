name: Build Windows Executables

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable vcpkg GitHub Actions binary cache
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Install gRPC and Protobuf via vcpkg
        run: |
          vcpkg install grpc:x64-windows protobuf:x64-windows
        env:
          VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

      - name: Configure CMake
        run: |
          cmake -B build -S . `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET="x64-windows"

      - name: Build Server and Client
        run: |
          cmake --build build --config Release

      - name: Upload Windows Binaries (.exe & .dll)
        uses: actions/upload-artifact@v4
        with:
          name: windows-calculator-binaries
          path: build/Release/
